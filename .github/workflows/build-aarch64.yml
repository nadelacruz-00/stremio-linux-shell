name: Build aarch64 (Ubuntu 26.04)

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # Required for creating releases on tags

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04

    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TERM_COLOR: always

    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            file \
            git \
            ninja-build \
            pkg-config \
            libssl-dev \
            libmpv-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libnss3 \
            libnspr4 \
            libasound2t64 \
            libcups2t64 \
            libgbm1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and CEF
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            vendor/cef
          key: ubuntu-26.04-aarch64-${{ hashFiles('**/Cargo.lock', 'build.rs') }}
          restore-keys: ubuntu-26.04-aarch64-

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify binary
        run: |
          file target/release/stremio-linux-shell
          file target/release/stremio-linux-shell | grep -q "ARM aarch64"
          file vendor/cef/libcef.so | grep -q "ARM aarch64"
          LD_LIBRARY_PATH=vendor/cef ldd target/release/stremio-linux-shell

      - name: Package tarball
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          PKG="stremio-enhanced-${VERSION}-ubuntu26.04-aarch64"
          echo "PKG=${PKG}" >> "$GITHUB_ENV"

          # Mirror the layout install.sh expects so it can be run from the extracted dir
          mkdir -p "${PKG}/target/release" "${PKG}/vendor" "${PKG}/data/icons"
          cp target/release/stremio-linux-shell "${PKG}/target/release/"
          cp data/server.js "${PKG}/target/release/"
          cp -r vendor/cef "${PKG}/vendor/"
          cp -r data/icons/hicolor "${PKG}/data/icons/"
          cp stremio-enhanced.desktop install.sh README.md "${PKG}/"

          tar -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.tar.gz
            ${{ env.PKG }}.tar.gz.sha256

      - name: Generate release notes
        if: github.ref_type == 'tag'
        run: scripts/release-notes.sh release-notes.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create or update release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            ${{ env.PKG }}.tar.gz
            ${{ env.PKG }}.tar.gz.sha256
